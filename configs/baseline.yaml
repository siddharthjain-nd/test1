# Baseline configuration.
#
# Every tunable lives in a config file, never in code (PLAN.md section 3).
# Copy this to configs/experiments/<name>.yaml and change one thing at a time.
#
# Values marked TODO are set in the phase that introduces them. Nothing here is
# active yet - Phase 0 only establishes the file.

pipeline_version: "0.0.1"

corpus:
  # Absolute path to the photo library. Differs per machine, so override with the
  # FACEINDEX_CORPUS environment variable rather than committing a local path.
  root: null
  follow_symlinks: false
  # Extensions considered photographs. Videos are out of scope.
  include_extensions: [".jpg", ".jpeg", ".png", ".heic", ".heif", ".webp", ".tif", ".tiff"]

ingest:
  # Cheap identity check before hashing whole files: (size, first 64KB, last 64KB).
  quick_hash_bytes: 65536
  # Full SHA-256 only when a quick hash collides.
  verify_collisions_with_sha256: true
  # Discard obvious non-photographs before paying for a decode.
  drop_screenshots: true
  drop_below_pixels: 10000

decode:
  # Register C4 was SUPERSEDED on 2026-09-06: the cap was raised 1280 -> 2048 because
  # Image.draft() scales by powers of two, so the extra resolution costs almost nothing.
  max_long_edge: 2048
  honour_exif_orientation: true

detect:
  # Register C5 was WITHDRAWN, not deferred (decision 21). Detection is the only stage
  # that needs the original photos, so a face missed here is permanently absent from the
  # gold set, whereas embedding can be redone from the saved crops for free.
  model: "buffalo_l/det_10g.onnx"
  # 640, not 1024 (decision 22): measured on a real 6-face photo, 1024 found the *same*
  # faces with *lower* confidence at 2.2x the cost.
  input_size: [640, 640]
  score_threshold: 0.5
  nms_threshold: 0.4

align:
  output_size: 112
  # Wider crop kept alongside the aligned one, for human labelling only.
  context_scale: 2.0
  context_size: 256

embed:
  model: "buffalo_sc/w600k_mbf.onnx"  # Register C6; upgraded in Phase 5
  input_size: 112
  # ArcFace preprocessing. NOT x/255 - getting this wrong silently degrades everything.
  # 127.5 matches InsightFace's reference ArcFaceONNX. CONTEXT.md section 6 says 128.0;
  # scripts/verify_embedding_parity.py measures the difference rather than arguing it.
  mean: 127.5
  scale: 127.5
  input_layout: "NCHW"
  channel_order: "RGB"
  l2_normalise: true
  flip_tta: false                     # Register C8
  batch_size: 64

quality:
  # Phase 3 sets real values. Nothing is gated in the baseline.
  enabled: false
  min_interocular_px: null
  max_blur: null
  max_abs_yaw_deg: null
  min_det_score: null

cluster:
  algorithm: "hdbscan"
  # Embeddings are L2-normalised, so squared Euclidean distance is 2 - 2*cos: a monotonic
  # function of cosine distance, giving identical clusters while letting sklearn use a
  # tree instead of a dense 64k x 64k matrix (32 GB) that will not fit on the 8 GB box.
  metric: "euclidean_on_normalised"
  min_cluster_size: 3
  min_samples: null
  # Off by default. Measure before optimising (PLAN.md section 0, guiding principle 1).
  pca_components: null
  # Phase 4 additions.
  cannot_link_same_photo: false
  time_prior: false

# Phase 1 gold-set sampling. The sampler asserts these targets and fails when it misses,
# so the mix is verified rather than assumed.
sample:
  target_size: 1800
  # One person with 500 faces contributes ~125,000 pairs and owns the metric outright;
  # 20 burst frames contribute 190 trivially-easy pairs. Identity is unknown at sampling
  # time, so the bootstrap cluster stands in for it.
  per_cluster_per_day: 3
  per_cluster_total: 70
  # Superseded by the `clustered` target below, which enforces the same thing as a stratum.
  # Raise above 0 only to force a floor of explicitly tagged noise-review faces on top.
  noise_review_share: 0.0
  detector_fp_count: 50
  cross_era_bonus: 0.5
  tolerance: 0.05
  # Measured: 2,163 images (~12% of candidates) from a retouching app. These filters alter
  # face geometry, which is precisely what the embedding encodes.
  beauty_marker: "You cam perfect"

  targets:
    # Deliberately unlike the corpus, which is 33.8% tiny. Raised 0.10 -> 0.15 on 2026-09-19
    # (decision 29) after inspecting the contact sheet: the tiny faces are genuine -- background
    # people and faces inside framed photographs -- not detector noise. Still unidentifiable, so
    # still gated out of clustering in Phase 3; included so that gate can be tuned against them.
    size:     { tiny: 0.15, small: 0.24, medium: 0.38, large: 0.23 }
    # Corpus is 48/31/21. PLAN.md targets 55/30/15; DEVLOG argues the strata should follow
    # the corpus. Left at the plan of record - changing it is a decision to be logged.
    pose:     { frontal: 0.55, semi: 0.30, profile: 0.15 }
    era:      { oldest: 0.35, middle: 0.25, recent: 0.35, undated: 0.05 }
    kind:     { photo: 0.67, forwarded: 0.33 }
    filtered: { plain: 0.88, beauty: 0.12 }
    group:    { solo: 0.85, group: 0.15 }
    quality:  { good: 0.60, marginal: 0.25, bad: 0.15 }
    # Did the bootstrap manage to group this face at all? Measured 2026-09-21: unclustered
    # faces are 38% readable vs 43% for clustered ones, so they are ordinary photographs of
    # people who appear too rarely to reach the three-face minimum a cluster needs. They are
    # the hardest material available, and the share must be controlled in both directions:
    # unmanaged it hit 63% and buried the labelling; capped at 10% the gold set would hold
    # only faces the baseline already handles and would score well while teaching nothing.
    clustered: { clustered: 0.70, noise: 0.30 }

gold:
  labels_csv: "data/gold/labels.csv"
  ui_port: 8765
  # Localhost only. These crops are biometric data and the server has no authentication.
  ui_host: "127.0.0.1"

runtime:
  execution_provider: "CPUExecutionProvider"  # never CoreML/CUDA for stored embeddings
  intra_op_num_threads: 4
  decode_workers: 4
  random_seed: 20260906
